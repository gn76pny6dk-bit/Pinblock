name: Pinblock
options:
  bundleIdPrefix: com.jordan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
packages:
  PinblockCore:
    path: PinblockCore
targets:
  Pinblock:
    type: application
    platform: iOS
    sources:
      - path: Pinblock
        excludes:
          - Info.plist
    dependencies:
      - package: PinblockCore
        product: PinblockCore
    settings:
      base:
        PRODUCT_NAME: Pinblock
        PRODUCT_BUNDLE_IDENTIFIER: com.jordan.pinblock
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Pinblock/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Pinblock:
    build:
      targets:
        Pinblock: all
    run:
      config: Debug
    archive:
      config: Release
