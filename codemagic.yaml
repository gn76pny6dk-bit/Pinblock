workflows:
  ios-unsigned:
    name: Pinblock unsigned IPA
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Test and build unsigned IPA
        script: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh
    artifacts:
      - build/Pinblock-unsigned.ipa
      - build/test-log.txt
